<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join Rototuna Alumni Network</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="signup-page">

        <section class="signup-card">
            <a href="index.html" class="back-home-link">
                ← Back to Home
            </a>

            <p class="form-label">ROTOTUNA ALUMNI NETWORK</p>

            <h1>Create your alumni account</h1>

            <p class="form-introduction">
                Join the community and reconnect with former students.
            </p>
            <form class="signup-form">

                <label for="full-name">Full name</label>
                <input type="text" id="full-name" name="full-name" placeholder="Enter your full name" required>

                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required>

                <label for="graduation-year">Graduation year</label>
                <input type="number" id="graduation-year" name="graduation-year" placeholder="For example: 2020"
                    min="2000" max="2026" required>

                <label for="password">Create password</label>
                <input type="password" id="password" name="password" placeholder="Enter a secure password" required>
                <label for="confirm-password">Confirm password</label>
                <input type="password" id="confirm-password" name="confirm-password"
                    placeholder="Enter your password again" required>
                <button type="submit" class="signup-submit-button">
                    Create Account
                </button>
                <p class="login-link">
                    Already have an account?
                    <a href="login.html">Sign in</a>
                </p>
            </form>

        </section>

    </main>

</body>

</html>
