<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Rototuna Alumni Network</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="signup-page">

        <section class="signup-card">

            <a href="index.html" class="back-home-link">
                ← Back to Home
            </a>

            <p class="form-label">
                ROTOTUNA ALUMNI NETWORK
            </p>

            <h1>Welcome back</h1>

            <p class="form-introduction">
                Sign in to access your alumni profile and community.
            </p>

            <form class="signup-form">

                <label for="login-email">Email address</label>
                <input type="email" id="login-email" name="login-email" placeholder="Enter your email address" required>

                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="login-password" placeholder="Enter your password"
                    required>
                <a href="#" class="forgot-password-link">
                    Forgot password?
                </a>

                <button type="submit" class="signup-submit-button">
                    Sign In
                </button>

                <p class="login-link">
                    Do not have an account?
                    <a href="signup.html">Create an account</a>
                </p>

            </form>

        </section>

    </main>

</body>

</html>
